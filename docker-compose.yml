x-slurmd-resources: &slurmd-resources
  cpus: 4
  cpuset: "0-3"
  mem_limit: 6g

services:
  mysql:
    image: mariadb:10.11
    hostname: mysql
    container_name: mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: slurm_acct_db
      MYSQL_USER: slurm
      MYSQL_PASSWORD: password
    volumes:
      - var_lib_mysql:/var/lib/mysql
    networks:
      - slurm-network

  slurmdbd:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    init: true
    build:
      context: .
      args:
        SLURM_TAG: ${SLURM_TAG}
        QFW_BUILD_JOBS: ${QFW_BUILD_JOBS:-4}
        QFW_REPOSITORY: ${QFW_REPOSITORY:-https://github.com/openQSE/QFw.git}
        QFW_REF: ${QFW_REF:-release/v0.1}
        QFW_SLURM_REPOSITORY: ${QFW_SLURM_REPOSITORY:-https://github.com/openQSE/qfw-slurm.git}
        QFW_SLURM_REF: ${QFW_SLURM_REF:-release/v0.1}
    command: ["slurmdbd"]
    container_name: slurmdbd
    hostname: slurmdbd
    volumes:
      - root_ssh:/root/.ssh
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
      - ${QFW_CONTAINER_BASE}:/workspace/qfw-container-base
      - ${QFW_CONTAINER_BASE}/home:/workspace/home
    expose:
      - "6819"
    depends_on:
      - mysql
    networks:
      - slurm-network

  slurmctld:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    init: true
    command: ["slurmctld"]
    container_name: slurmctld
    hostname: slurmctld
    volumes:
      - root_ssh:/root/.ssh
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - slurm_jobdir:/data
      - var_log_slurm:/var/log/slurm
      - ./shared-dir:/mnt
      - ${QFW_CONTAINER_BASE}:/workspace/qfw-container-base
      - ${QFW_CONTAINER_BASE}/home:/workspace/home
      # Shim live-edit overlay: the new parallel bifurcation service plus its
      # service-registry entry. Native svc_iqm_qpm is unchanged, so it needs
      # no overlay. (Targeted mounts avoid shadowing image-built artifacts.)
    expose:
      - "6817"
    depends_on:
      - "slurmdbd"
    networks:
      - slurm-network

  slurmrestd:
    image: ${IMAGE_NAME}:${IMAGE_TAG}
    init: true
    command: ["slurmrestd"]
    #command: ["TJNXXX"]
    container_name: slurmrestd
    hostname: slurmrestd
    volumes:
      - root_ssh:/root/.ssh
      - etc_munge:/etc/munge
      - etc_slurm:/etc/slurm
      - var_log_slurm:/var/log/slurm
      - slurm_jobdir:/data
      - ${QFW_CONTAINER_BASE}:/workspace/qfw-container-base
      - ${QFW_CONTAINER_BASE}/home:/workspace/home
    expose:
      - "6820"
    ports:
      - "6820:6820"
    depends_on:
      - "slurmctld"
    networks:
      - slurm-network

  c1:
    <<: *slurmd-resources
