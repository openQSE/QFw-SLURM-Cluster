# Tempo for the QFw telemetry stack: a single binary with local storage.
# The collector forwards traces here over OTLP gRPC; Grafana queries :3200.
stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Retention stays at Tempo's default of 14 days, long enough to keep a
# rehearsal's traces visible at the booth.

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
