# OpenTelemetry Collector for the QFw telemetry stack.
#
# QFw processes send OTLP over HTTP to :4318 (QFW_TELEMETRY=otlp with
# QFW_TELEMETRY_ENDPOINT=http://otel-collector:4318). Traces go on to Tempo,
# logs to Loki over its own OTLP endpoint, and metrics are exposed on :8889
# for Prometheus to scrape. The collector is the
# storage boundary the benchmarking design describes: QFw emits OTLP and
# stops here, and anything past this file is a deployment choice.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch:
    timeout: 1s
  # A Qiskit client is a short process: it reports a handful of samples and
  # exits, and each process is a new service.instance.id. Left alone,
  # Prometheus would hold one short series per process, and rate() and
  # increase() never count the first sample of a series. So metrics are
  # reduced to deltas (a no-op for processes that already export deltas,
  # which the overlay asks for), the instance id and the Slurm job id are
  # dropped, and the deltas are accumulated again into one series per
  # service and device. Order matters: deltas are taken while the instance
  # id still tells the series apart, and merged only after it is gone.
  cumulativetodelta:
    initial_value: keep
  resource/merge-instances:
    attributes:
      - key: service.instance.id
        action: delete
      # The SDK's own version would otherwise be a label too, and two QFw
      # installs on different SDK releases would split one device's series.
      - key: telemetry.sdk.version
        action: delete
      - key: telemetry.sdk.name
        action: delete
      - key: telemetry.sdk.language
        action: delete
  # Metrics only. The Slurm job id stays on spans and log lines, where a job
  # is looked up. On a metric it would start a new series for every job,
  # which is the short-series problem again.
  resource/metrics-per-device:
    attributes:
      - key: qfw.slurm.job_id
        action: delete
  # Once merged, the processes' points share one series, and
  # deltatocumulative drops a point that starts before the series did
  # (ErrOlderStart) or is not newer than the last one (ErrOutOfOrder).
  # Clients export on their own timers, so both happen: two clients in one
  # job lost up to 4 jobs in 10. A delta point is a count since the last
  # export, so only its order matters here. It is stamped with the time the
  # collector handles it, after the batch processor, which hands on one
  # batch at a time, so the stamps rise in the order deltatocumulative
  # sees them.
  transform/receive-time:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        conditions:
          - metric.aggregation_temporality == AGGREGATION_TEMPORALITY_DELTA
        statements:
          - set(time, Now())
          - set(start_time, time)
  deltatocumulative:
    max_stale: 168h

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # Loki takes OTLP directly; the exporter appends /v1/logs itself.
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    # Resource attributes become labels on every series, so a QPM's device
    # (qfw.device.name on its resource) and service.name are there to group
    # by. QFw keeps resource attributes dimensional for exactly this reason.
    resource_to_telemetry_conversion:
      enabled: true
    # Keep a series on the scrape page through a quiet spell, so the
    # dashboards' last-five-minutes panels read zero rather than nothing.
    # As long as deltatocumulative keeps its total: a series that left the
    # page comes back as a new one, and increase() misses the job that
    # brought it back.
    metric_expiration: 168h

service:
  telemetry:
    logs:
      level: info
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [cumulativetodelta, resource/merge-instances, resource/metrics-per-device, batch, transform/receive-time, deltatocumulative]
      exporters: [prometheus]
    # The same resource trimming as for metrics: Loki would otherwise index
    # one stream per client process on service.instance.id.
    logs:
      receivers: [otlp]
      processors: [resource/merge-instances, batch]
      exporters: [otlphttp/loki]
