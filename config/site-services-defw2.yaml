# The QPMs the DEFw v2 prototype's site plane serves: NWQ-Sim, and the fake
# IQM QPM. They are the v1 plane's entries in site-services.yaml with ports
# of their own, so both planes can run at once.
services:
  - name: nwqsim
    credential-mode: no-secret
    module: svc_nwqsim_qpm
    load-modules: svc_nwqsim_qpm,api_launcher
    environment-modules:
      - libfabric
      - openmpi
      - nwqsim
    required-executables:
      - circuit_runner.nwqsim
    agent-prefix: qpm_nwqsim
    assigned-hosts: ${QFW_SIMULATOR_NODES}
    assigned-hosts-env: QFW_QPM_ASSIGNED_HOSTS
    listen-port: 8494
    telnet-port: 8495
    provider-launch:
      type: mpi
      wrapper: null

  - name: fake-iqm
    credential-mode: no-secret
    module: svc_fake_iqm_qpm
    load-modules: svc_fake_iqm_qpm,api_launcher
    agent-prefix: qpm_fake_iqm
    assigned-hosts: group1
    assigned-hosts-env: QFW_QPM_ASSIGNED_HOSTS
    device-id: fake-iqm-20q
    listen-port: 8594
    telnet-port: 8595
    provider-launch:
      type: internal
