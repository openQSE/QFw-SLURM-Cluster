# The QPMs the DEFw v2 prototype's site plane serves. They are the v1 plane's
# entries in site-services.yaml with ports of their own, four above v1's, so
# both planes can run at once.
services:
  - name: nwqsim
    credential-mode: no-secret
    module: svc_nwqsim_qpm
    load-modules: svc_nwqsim_qpm,api_launcher
    environment-modules:
      - libfabric
      - openmpi
      - nwqsim
    required-executables:
      - circuit_runner.nwqsim
    agent-prefix: qpm_nwqsim
    assigned-hosts: ${QFW_SIMULATOR_NODES}
    assigned-hosts-env: QFW_QPM_ASSIGNED_HOSTS
    listen-port: 8494
    telnet-port: 8495
    provider-launch:
      type: mpi
      wrapper: null

  - name: fake-iqm
    credential-mode: no-secret
    module: svc_fake_iqm_qpm
    load-modules: svc_fake_iqm_qpm,api_launcher
    agent-prefix: qpm_fake_iqm
    assigned-hosts: group1
    assigned-hosts-env: QFW_QPM_ASSIGNED_HOSTS
    device-id: fake-iqm-20q
    listen-port: 8594
    telnet-port: 8595
    provider-launch:
      type: internal

  - name: iqm-ornl-20q
    credential-mode: required
    module: svc_iqm_qpm
    load-modules: svc_iqm_qpm,api_launcher
    agent-prefix: qpm_iqm
    device-id: ornl-iqm-20q
    listen-port: 8294
    telnet-port: 8295
    provider-launch:
      type: remote-api

  - name: shim-ornl-20q
    credential-mode: required
    module: svc_lib_qpm
    load-modules: svc_lib_qpm,api_launcher
    agent-prefix: qpm_shim
    device-id: ornl-iqm-20q
    listen-port: 8394
    telnet-port: 8395
    provider-launch:
      type: qrmi-qdmi

  - name: shim-ibm-156-nh
    credential-mode: required
    module: svc_lib_qpm
    load-modules: svc_lib_qpm,api_launcher
    agent-prefix: qpm_shim_ibm
    device-id: ibm-156-nh
    listen-port: 8694
    telnet-port: 8695
    provider-launch:
      type: qrmi-qdmi

  - name: shim-aws-qpm
    credential-mode: required
    module: svc_lib_qpm
    load-modules: svc_lib_qpm,api_launcher
    agent-prefix: qpm_shim_aws
    device-id: aws
    listen-port: 8794
    telnet-port: 8795
    provider-launch:
      type: qrmi-qdmi
