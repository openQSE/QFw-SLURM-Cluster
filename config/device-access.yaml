qpus:
  ornl-iqm-20q:
    provider: iqm
    provider-device-id: default
    url: https://qccsw.ccs.ornl.gov/
    credential-db: qpu-users.json
  fake-iqm-20q:
    provider: fake-iqm
    provider-device-id: fake-iqm-20q
  backline-local:
    provider: backline
    provider-device-id: backline-local
  qblox-cluster:
    provider: qblox
    provider-device-id: cluster_mm
    url: 192.168.0.2
    credential-provider: qblox-no-secret
  ibm-156-nh:
    provider: ibm
    provider-device-id: ibm_156_nh
    resource-type: IBMQiskitRuntimeService
    url: https://quantum.cloud.ibm.com/api/v1
    credential-db: qpu-users.json
    libraries:
      - qrmi
    preference: qrmi
    execution-owner: qrmi
    caps:
      run_circuit: [qrmi]
      get_backend_info: [qrmi]
      get_task_timing: [qrmi]
      get_task_metadata: [qrmi]
  aws:
    provider: aws
    provider-device-id: aws
    url: https://braket.us-east-1.amazonaws.com
    credential-db: qpu-users.json
    libraries:
      - qdmi
    preference: qdmi
    execution-owner: qdmi
    caps:
      run_circuit: [qdmi]
      get_task_timing: [qdmi]
      get_task_metadata: [qdmi]
  # Amazon Braket's SV1 state-vector simulator (34 qubits), in us-east-1.
  # A results bucket in the device's Region is needed before a task can run:
  # set s3-results-uri to a bucket named amazon-braket-*, see QFw's
  # docs/recipes/run-against-aws-braket.md.
  aws-sv1:
    provider: aws
    provider-device-id: arn:aws:braket:::device/quantum-simulator/amazon/sv1
    qdmi-device-id: amazon.braket.sv1
    aws-region: us-east-1
    # s3-results-uri: s3://amazon-braket-<site>/qfw/sv1
    url: https://braket.us-east-1.amazonaws.com
    num-qubits: 34
    credential-db: qpu-users.json
    libraries:
      - qdmi
    preference: qdmi
    execution-owner: qdmi
    caps:
      run_circuit: [qdmi]
      get_task_timing: [qdmi]
      get_task_metadata: [qdmi]
  # Rigetti's Cepheus-1-108Q through Braket, in us-west-1: a real QPU, billed
  # per task and per shot. max-shots refuses a larger request before a task
  # exists; job-timeout-seconds is how long a queued task is waited for
  # before it is cancelled (two hours, the length of an execution window gap).
  aws-cepheus:
    provider: aws
    provider-device-id: arn:aws:braket:us-west-1::device/qpu/rigetti/Cepheus-1-108Q
    qdmi-device-id: amazon.braket.rigetti.cepheus-1-108q
    aws-region: us-west-1
    # s3-results-uri: s3://amazon-braket-<site>/qfw/cepheus
    url: https://braket.us-west-1.amazonaws.com
    num-qubits: 108
    max-shots: 1024
    job-timeout-seconds: 7200
    credential-db: qpu-users.json
    libraries:
      - qdmi
    preference: qdmi
    execution-owner: qdmi
    caps:
      run_circuit: [qdmi]
      get_task_timing: [qdmi]
      get_task_metadata: [qdmi]
  ibm-fake-lagos:
    provider: ibm
    resource-type: IBMQuantumSystem
    provider-device-id: fake_lagos
    url: http://HOST_IP_ADDRESS:8292
    iam-endpoint: http://HOST_IP_ADDRESS:8292
    service-crn: ""
    s3-endpoint: http://HOST_IP_ADDRESS:9000
    s3-bucket: ""
    s3-region: ""
    job-timeout-seconds: "400"
    credential-db: qpu-users.json
    libraries:
      - qrmi
    preference: qrmi
    execution-owner: qrmi
    caps:
      get_device_info: [qrmi]
      get_coupling_graph: [qrmi]
      get_backend_info: [qrmi]
      get_dynamic_backend_info: [qrmi]
      run_circuit: [qrmi]
      get_task_timing: [qrmi]
      get_task_metadata: [qrmi]
      get_calibration_snapshot: [qrmi]
  # Pasqal Cloud's free emulator, through QRMI's PasqalCloud resource or
  # Pasqal's native QDMI library (pasqal-qdmi); QRMI unless a job asks for
  # qdmi. The QPM runs as the service: its login is the .pasqal/config under
  # PASQAL_CONFIG_ROOT (qfw-site-services forwards it, default /mnt/pasqal,
  # and points PASQAL_AUTHFILE at the same file for pasqal-qdmi). Both
  # libraries read it and renew the token themselves, and that file also
  # names the project the jobs are billed to. A user needs no key, only an
  # enabled entry for the device in qpu-users.json (see
  # docs/recipes/run-pasqal-emu-free-job.md).
  pasqal-emu-free:
    provider: pasqal
    provider-device-id: EMU_FREE
    resource-type: PasqalCloud
    url: https://apis.pasqal.cloud
    credential-db: qpu-users.json
    credential-provider: pasqal-entitlement
    libraries:
      - qrmi
      - qdmi
    preference: qrmi
    execution-owner: qrmi
    caps:
      get_backend_info: [qrmi, qdmi]
      get_device_info: [qdmi]
      run_circuit: [qrmi, qdmi]
      get_task_timing: [qrmi, qdmi]
      get_task_metadata: [qrmi, qdmi]
    job-timeout-seconds: 1800

credential-providers:
  # Admits a user by the enabled flags in the credential DB and binds no
  # secret; the QPM's own login does the work (see pasqal-emu-free above).
  pasqal-entitlement:
    type: entitlement

credential-providers:
  # The Qblox cluster has no token to present; the address in its url is the
  # whole of its access configuration.
  qblox-no-secret:
    type: no-secret
