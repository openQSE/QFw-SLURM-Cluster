qpus:
  ornl-iqm-20q:
    provider: iqm
    provider-device-id: default
    url: https://qccsw.ccs.ornl.gov/
    credential-db: qpu-users.json
  fake-iqm-20q:
    provider: fake-iqm
    provider-device-id: fake-iqm-20q
  backline-local:
    provider: backline
    provider-device-id: backline-local
  ibm-156-nh:
    provider: ibm
    provider-device-id: ibm_156_nh
    resource-type: IBMQiskitRuntimeService
    url: https://quantum.cloud.ibm.com/api/v1
    credential-db: qpu-users.json
    libraries:
      - qrmi
    preference: qrmi
    execution-owner: qrmi
    caps:
      run_circuit: [qrmi]
      get_backend_info: [qrmi]
      get_task_timing: [qrmi]
      get_task_metadata: [qrmi]
  aws:
    provider: aws
    provider-device-id: aws
    url: https://braket.us-east-1.amazonaws.com
    credential-db: qpu-users.json
    libraries:
      - qdmi
    preference: qdmi
    execution-owner: qdmi
    caps:
      run_circuit: [qdmi]
      get_task_timing: [qdmi]
      get_task_metadata: [qdmi]
  aws-ionq-aria-1:
    provider: aws
    provider-device-id: arn:aws:braket:us-east-1::device/qpu/ionq/Aria-1
    url: https://braket.us-east-1.amazonaws.com
    credential-db: qpu-users.json
    libraries:
      - qdmi
    preference: qdmi
    execution-owner: qdmi
    caps:
      run_circuit: [qdmi]
      get_task_timing: [qdmi]
      get_task_metadata: [qdmi]
  aws-rigetti-ankaa:
    provider: aws
    provider-device-id: arn:aws:braket:us-west-1::device/qpu/rigetti/Ankaa-3
    url: https://braket.us-west-1.amazonaws.com
    credential-db: qpu-users.json
    libraries:
      - qdmi
    preference: qdmi
    execution-owner: qdmi
    caps:
      run_circuit: [qdmi]
      get_task_timing: [qdmi]
      get_task_metadata: [qdmi]
  ibm-fake-lagos:
    provider: ibm
    resource-type: IBMQuantumSystem
    provider-device-id: fake_lagos
    url: http://HOST_IP_ADDRESS:8292
    iam-endpoint: http://HOST_IP_ADDRESS:8292
    service-crn: ""
    s3-endpoint: http://HOST_IP_ADDRESS:9000
    s3-bucket: ""
    s3-region: ""
    job-timeout-seconds: "400"
    credential-db: qpu-users.json
    libraries:
      - qrmi
    preference: qrmi
    execution-owner: qrmi
    caps:
      get_device_info: [qrmi]
      get_coupling_graph: [qrmi]
      get_backend_info: [qrmi]
      get_dynamic_backend_info: [qrmi]
      run_circuit: [qrmi]
      get_task_timing: [qrmi]
      get_task_metadata: [qrmi]
      get_calibration_snapshot: [qrmi]
  # Pasqal Cloud's free emulator, through QRMI's PasqalCloud resource. The QPM
  # runs as the service: its login is the .pasqal/config under
  # PASQAL_CONFIG_ROOT (qfw-site-services forwards it, default /mnt/pasqal),
  # which QRMI reads and renews itself, and that file also names the project
  # the jobs are billed to. A user needs no key, only an enabled entry for the
  # device in qpu-users.json (see docs/recipes/run-pasqal-emu-free-job.md).
  pasqal-emu-free:
    provider: pasqal
    provider-device-id: EMU_FREE
    resource-type: PasqalCloud
    url: https://apis.pasqal.cloud
    credential-db: qpu-users.json
    credential-provider: pasqal-entitlement
    libraries:
      - qrmi
    job-timeout-seconds: 1800

credential-providers:
  # Admits a user by the enabled flags in the credential DB and binds no
  # secret; the QPM's own login does the work (see pasqal-emu-free above).
  pasqal-entitlement:
    type: entitlement
