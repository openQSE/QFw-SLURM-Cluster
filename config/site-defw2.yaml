# The DEFw v2 prototype's site plane. It runs beside the v1 plane that
# site.yaml describes, so its directory and QPMs listen on ports of their
# own, and it publishes its directory in a connection file of its own.
# QFW_DEFW_VERSION=2 makes qfw-site-services use this file, and a QFw run
# reaches this plane by naming it in QFW_SITE_CONFIG.

# QFw and DEFw installation roots are supplied by qfw-activate.
install:
  qfw-prefix: ${QFW_PREFIX}
  defw-prefix: ${DEFW_PREFIX}

# qfw-dir-svc publishes its selected host and this port in connection-file.
directory-service:
  name: qfw-site-dirsvc
  listen-port: 8190
  connect-timeout-seconds: 300
  connection-file: ${QFW_SHARED_ROOT}/qfw-site-services-defw2/directory-service.json

# Provider secrets remain in the root-readable device configuration.
service:
  manifest: /etc/openqse/qfw/services/site-services-defw2.yaml
  device-access-config: /etc/openqse/qfw/device/device-access.yaml

qpm:
  completion-queues:
    retention:
      completion-ttl-seconds: 3600
      terminal-reservation-retention-seconds: 3600
      max-records-per-reservation: 1024
      max-bytes-per-reservation: 67108864
      purge-interval-seconds: 60
