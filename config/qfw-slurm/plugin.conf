# Root-owned native QSGP client and resource mapping.
[gateway]
host=slurmctld
port=18095
connect_timeout_ms=5000
request_timeout_ms=120000
max_credential_bytes=65536
expected_munge_uid=qfw-slurm

[resource "nwqsim"]
service_id=nwqsim

[resource "ornl-iqm-20q"]
service_id=iqm-ornl-20q

[resource "ornl-shim-20q"]
service_id=shim-ornl-20q

[resource "ibm-156-nh"]
service_id=shim-ibm-156-nh

[resource "aws-ionq-aria-1"]
service_id=shim-aws-qpm

# aws-rigetti-ankaa is not mapped: qfw-slurm requires one resource per
# service_id, and the AWS shim is single-target until it can bind a
# reservation's target to its AWS-QDMI device session.

[resource "fake-iqm-20q"]
service_id=fake-iqm

[resource "backline-local"]
service_id=backline-local
