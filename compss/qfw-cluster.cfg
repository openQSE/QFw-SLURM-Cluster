################################
## QFw-SLURM-Cluster
################################
# COMPSs supercomputer configuration for the Docker Slurm cluster. It starts
# from COMPSs' default.cfg and changes only what the containers need:
#   - Slurm instead of LSF, so launch_compss starts workers with srun inside
#     the allocation (no SSH), and srun forwards the job environment,
#     including QFW_RESERVATIONS, to every worker.
#   - The c* node shape from slurm.conf: 4 CPUs and 6 GB.
#   - JVM heaps that fit that shape.
#   - /workspace/home as the shared disk, so COMPSs does not copy files
#     between nodes that already see them.
################################
## STRUCTURE VARIABLES
################################
QUEUE_SYSTEM="slurm" #from queues/

################################
## ENQUEUE_COMPSS VARIABLES
################################
DEFAULT_EXEC_TIME=10
DEFAULT_NUM_NODES=3
DEFAULT_NUM_SWITCHES=0
MAX_NODES_SWITCH=18
MIN_NODES_REQ_SWITCH=4
DEFAULT_QUEUE=normal
DEFAULT_MAX_TASKS_PER_NODE=-1
DEFAULT_CPUS_PER_NODE=4
DEFAULT_FORWARD_CPUS_PER_NODE="false"
DEFAULT_IO_EXECUTORS=0
DEFAULT_GPUS_PER_NODE=0
DEFAULT_WORKER_IN_MASTER_CPUS=0
DEFAULT_WORKER_IN_MASTER_MEMORY=disabled
DEFAULT_JOB_EXECUTION_DIR=.
DEFAULT_WORKER_WORKING_DIR=local_disk
DEFAULT_NETWORK=ethernet
DEFAULT_DEPENDENCY_JOB=None
DEFAULT_RESERVATION=disabled
DEFAULT_NODE_MEMORY=disabled
DEFAULT_JVM_MASTER="-Xms256m,-Xmx1024m"
DEFAULT_JVM_WORKERS="-Xms128m,-Xmx512m"
DEFAULT_JVM_WORKER_IN_MASTER=""
DEFAULT_NODE_MEMORY_SIZE=6
DEFAULT_NODE_STORAGE_BANDWIDTH=""

################################
## Enabling/disabling passing
## options to the queue system
################################
DISABLE_QARG_MEMORY=false
DISABLE_QARG_CONSTRAINTS=true
DISABLE_QARG_LICENSES=true
DISABLE_QARG_QOS=true
DISABLE_QARG_CPUS_PER_TASK=false
DISABLE_QARG_NVRAM=true

################################
## SUBMISSION VARIABLES
################################
MINIMUM_NUM_NODES=1
MINIMUM_CPUS_PER_NODE=1
DEFAULT_STORAGE_HOME="null"
DISABLED_STORAGE_HOME="null"

################################
## LAUNCH VARIABLES
################################
LOCAL_DISK_PREFIX="/tmp"
REMOTE_EXECUTOR="none"
NETWORK_INFINIBAND_SUFFIX="-ib0"
NETWORK_DATA_SUFFIX="-data"
SHARED_DISK_PREFIX="/workspace/home/"
SHARED_DISK_2_PREFIX="/workspace/qfw-container-base/"
DEFAULT_NODE_MEMORY_SIZE=6
DEFAULT_NODE_STORAGE_BANDWIDTH=""
MASTER_NAME_CMD=hostname

################################
## Keys default.cfg lacks
################################
# launch_compss passes these straight into the worker command line unquoted.
# An unset one drops an argument there, and the worker refuses to start with
# "Incorrect number of parameters". Values follow COMPSs' own mn5.cfg.
DEFAULT_FPGAS_PER_NODE=0
DEFAULT_CONSTRAINTS=disabled
DEFAULT_LICENSES=disabled
DEFAULT_QOS=default
DISABLE_QARG_OVERCOMMIT=true
ELASTICITY_BATCH=true
ENABLE_PROJECT_NAME=false
HETEROGENEOUS_MULTIJOB=false
# Worker steps share the job's resources with the batch step instead of
# waiting for them, and do not each claim the job's memory.
LAUNCH_EXTRA_FLAGS=" --overlap --mem=0 "
